<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Signal — your engineering digest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Supabase JS Client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --paper: #E8E5D9;
    --paper-raised: #F1EEE3;
    --ink: #22261F;
    --ink-soft: #52564C;
    --ink-faint: #8B8C7F;
    --rule: #B9B6A5;
    --rule-strong: #22261F;
    --signal: #B8842E;
    --signal-dim: #D9C7A0;
    --teal: #2F4F49;
    --teal-bg: #DDE3DE;
    --opp: #6B4A9A;
    --opp-bg: #E5DEEE;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Source Serif 4', serif;
    line-height: 1.6;
    padding: 0 0 6rem;
  }

  .wrap { max-width: 760px; margin: 0 auto; padding: 0 1.5rem; }

  /* ===== Masthead ===== */
  .masthead { padding: 2.5rem 0 1.25rem; }

  .masthead-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 1rem;
  }

  h1.title {
    font-family: 'Fraunces', serif;
    font-size: clamp(2.6rem, 8vw, 4.2rem);
    font-weight: 600;
    letter-spacing: -0.02em;
    text-align: center;
    line-height: 0.95;
  }

  .tagline {
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-top: 0.6rem;
  }

  .rule-thick { border: none; border-top: 3px solid var(--rule-strong); margin: 1.5rem 0 0; }

  /* ===== Track tabs ===== */
  .tabs {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--rule-strong);
    margin-bottom: 1.75rem;
    overflow-x: auto;
  }
  .tab {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-soft);
    background: none;
    border: none;
    padding: 0.9rem 1rem 0.7rem;
    cursor: pointer;
    white-space: nowrap;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tab .count {
    color: var(--ink-faint);
    margin-left: 4px;
  }
  .tab.active {
    color: var(--ink);
    font-weight: 600;
    border-bottom: 2px solid var(--signal);
  }
  .tab:hover:not(.active) { color: var(--ink); }

  /* ===== Signal meter ===== */
  .signal-meter {
    display: inline-flex;
    align-items: flex-end;
    gap: 2px;
    height: 12px;
    vertical-align: middle;
  }
  .signal-meter .bar {
    width: 3px;
    background: var(--rule);
    border-radius: 1px;
  }
  .signal-meter .bar:nth-child(1) { height: 4px; }
  .signal-meter .bar:nth-child(2) { height: 6px; }
  .signal-meter .bar:nth-child(3) { height: 8px; }
  .signal-meter .bar:nth-child(4) { height: 10px; }
  .signal-meter .bar:nth-child(5) { height: 12px; }
  .signal-meter .bar.on { background: var(--signal); }

  .byline {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.03em;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .byline .dot { color: var(--rule); }

  /* ===== Section labels ===== */
  .section-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0 0 1rem;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-label::after {
    content: '';
    flex: 1;
    border-top: 1px solid var(--rule);
  }

  .lead-image {
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    border-radius: 2px;
    margin-bottom: 1rem;
    border: 1px solid var(--rule);
  }

  .digest-item-inner {
    display: flex;
    gap: 1rem;
    align-items: flex-start;
  }
  .digest-thumb {
    width: 96px;
    height: 96px;
    object-fit: cover;
    border-radius: 2px;
    border: 1px solid var(--rule);
    flex-shrink: 0;
  }
  .digest-body { flex: 1; min-width: 0; }

  @media (max-width: 480px) {
    .digest-thumb { width: 72px; height: 72px; }
  }

  /* ===== Lead story ===== */
  .lead { margin-bottom: 2.25rem; }
  .lead h2 {
    font-family: 'Fraunces', serif;
    font-size: clamp(1.7rem, 5vw, 2.35rem);
    font-weight: 600;
    line-height: 1.08;
    letter-spacing: -0.01em;
    margin: 0.6rem 0 0.7rem;
  }
  .lead .body-text {
    font-size: 1.08rem;
    line-height: 1.68;
    color: var(--ink);
  }

  /* ===== Digest items ===== */
  .digest-item {
    padding: 1.4rem 0;
    border-top: 1px solid var(--rule);
  }
  .digest-item h3 {
    font-family: 'Fraunces', serif;
    font-size: 1.28rem;
    font-weight: 600;
    line-height: 1.2;
    margin: 0.5rem 0 0.55rem;
  }
  .digest-item .body-text {
    font-size: 0.98rem;
    color: var(--ink);
  }

  .go-deeper {
    margin-top: 0.85rem;
    padding: 0.7rem 0.9rem;
    background: var(--teal-bg);
    border-left: 3px solid var(--teal);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--teal);
    line-height: 1.5;
  }

  .opportunity-tag {
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--opp);
    background: var(--opp-bg);
    padding: 3px 8px;
    border-radius: 2px;
    margin-bottom: 0.6rem;
  }

  .tags { margin-top: 0.7rem; display: flex; gap: 6px; flex-wrap: wrap; }
  .tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-soft);
    background: var(--paper-raised);
    border: 1px solid var(--rule);
    padding: 3px 8px;
    border-radius: 2px;
  }

  .read-source {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-top: 0.9rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.03em;
    color: var(--signal);
    text-decoration: none;
    border-bottom: 1px solid var(--signal-dim);
    padding-bottom: 1px;
  }
  .read-source:hover { border-bottom-color: var(--signal); }

  footer {
    margin-top: 3.5rem;
    padding-top: 1.5rem;
    border-top: 3px solid var(--rule-strong);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-faint);
    text-align: center;
    letter-spacing: 0.04em;
  }

  #loading, #empty {
    text-align: center;
    padding: 4rem 1rem;
    color: var(--ink-soft);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
  }

  @media (max-width: 480px) {
    .masthead-top { font-size: 10px; }
    .lead .body-text, .digest-item .body-text { font-size: 0.95rem; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div class="masthead-top">
      <span id="issue-date">—</span>
      <span>The Signal</span>
      <span id="issue-number">Live Feed</span>
    </div>
    <h1 class="title">The Signal</h1>
    <div class="tagline">Engineering, filtered. No noise, just what moved.</div>
  </header>
  <hr class="rule-thick">

  <nav class="tabs" id="tabs"></nav>

  <div id="loading">Loading today's issue…</div>
  <div id="empty" style="display:none;">Nothing cleared the signal threshold in this track today.</div>

  <main id="content"></main>

  <footer>
    generated automatically · signal threshold ≥ 3 · <span id="article-count"></span> articles today
  </footer>
</div>

<script>
// Replace these with your Supabase project credentials (Settings > API)
const SUPABASE_URL = 'https://srfhubczkyqgryphkpfb.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_WNpgnNEFi329sp-lnqRPdg_huw4yojT';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const TRACKS = ["Engineering", "Finance", "AI", "Trends", "Opportunities"];
let ALL_ARTICLES = [];
let activeTrack = "All";

function signalMeter(score) {
  let bars = '';
  for (let i = 1; i <= 5; i++) {
    bars += `<span class="bar ${i <= score ? 'on' : ''}"></span>`;
  }
  return `<span class="signal-meter" aria-label="Signal strength ${score} of 5">${bars}</span>`;
}

function formatDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr.includes('T') ? dateStr : dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
}

function renderArticle(a, isLead) {
  const tag = a.track === 'Opportunities'
    ? `<div class="opportunity-tag">Opportunity signal</div>`
    : '';

  const tagsList = Array.isArray(a.tags)
    ? a.tags
    : (typeof a.tags === 'string' ? JSON.parse(a.tags || '[]') : []);

  const bylineAndText = `
      ${tag}
      <div class="byline">
        ${signalMeter(a.relevance || 3)}
        <span class="dot">·</span>
        <span>${a.source || ''}</span>
        <span class="dot">·</span>
        <span>${a.date || ''}</span>
      </div>
      <${isLead ? 'h2' : 'h3'}>${a.headline || ''}</${isLead ? 'h2' : 'h3'}>
      <p class="body-text">${a.body || ''}</p>
      ${a.deep_dive ? `<div class="go-deeper">Go deeper — ${a.deep_dive}</div>` : ''}
      <div class="tags">${tagsList.map(t => `<span class="tag">${t}</span>`).join('')}</div>
      ${a.url ? `<a class="read-source" href="${a.url}" target="_blank" rel="noopener">Read the source →</a>` : ''}
  `;

  if (isLead) {
    const img = a.image_url
      ? `<img class="lead-image" src="${a.image_url}" alt="" onerror="this.remove()">`
      : '';
    return `<article class="lead">${img}${bylineAndText}</article>`;
  }

  const thumb = a.image_url
    ? `<img class="digest-thumb" src="${a.image_url}" alt="" onerror="this.remove()">`
    : '';
  return `
    <article class="digest-item">
      <div class="digest-item-inner">
        ${thumb}
        <div class="digest-body">${bylineAndText}</div>
      </div>
    </article>
  `;
}

function renderTabs() {
  const counts = { All: ALL_ARTICLES.length };
  TRACKS.forEach(t => { counts[t] = ALL_ARTICLES.filter(a => a.track === t).length; });

  const allTracks = ["All", ...TRACKS];
  const html = allTracks.map(t => {
    const count = counts[t] || 0;
    return `<button class="tab ${t === activeTrack ? 'active' : ''}" data-track="${t}">
      ${t}<span class="count">${count}</span>
    </button>`;
  }).join('');

  document.getElementById('tabs').innerHTML = html;

  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTrack = btn.dataset.track;
      renderTabs();
      renderContent();
    });
  });
}

function renderContent() {
  const filtered = activeTrack === "All"
    ? ALL_ARTICLES
    : ALL_ARTICLES.filter(a => a.track === activeTrack);

  document.getElementById('article-count').textContent = filtered.length;

  if (filtered.length === 0) {
    document.getElementById('content').innerHTML = '';
    document.getElementById('empty').style.display = 'block';
    return;
  }
  document.getElementById('empty').style.display = 'none';

  const sorted = [...filtered].sort((a, b) => (b.relevance || 0) - (a.relevance || 0));
  const [leadStory, ...rest] = sorted;

  let html = '';
  html += `<div class="section-label">Top signal</div>`;
  html += renderArticle(leadStory, true);

  if (rest.length > 0) {
    html += `<div class="section-label">Also in this track</div>`;
    rest.forEach(a => { html += renderArticle(a, false); });
  }

  document.getElementById('content').innerHTML = html;
}

async function loadIssue() {
  try {
    const { data, error } = await supabase
      .from('articles')
      .select('*')
      .order('id', { ascending: false });

    if (error) throw error;

    document.getElementById('loading').style.display = 'none';

    if (!data || data.length === 0) {
      document.getElementById('empty').style.display = 'block';
      return;
    }

    ALL_ARTICLES = data;

    const latestDate = data[0].date || new Date().toISOString().split('T')[0];
    document.getElementById('issue-date').textContent = formatDate(latestDate);

    renderTabs();
    renderContent();
  } catch (err) {
    document.getElementById('loading').textContent = 'Could not load articles. Check Supabase credentials & RLS policies.';
    console.error(err);
  }
}

loadIssue();
</script>
</body>
</html>
